{% extends "layout/main.html" %}

{% block title %}Biblioteca CNEC{% endblock %}

{% block content %}

<div class="flex items-center justify-center w-full py-4 md:py-6">

    <div class="flex flex-col bg-cnec-azul w-11/12 max-w-6xl">

        <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4 px-4 md:px-6 py-3 text-cnec-branco font-semibold border-b-4 border-cnec-amarelo">

            <div class="text-lg md:text-2xl font-bold border-l-4 border-cnec-amarelo pl-3 lg:mr-6 shrink-0">
                Pesquisa
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 w-full lg:w-auto lg:flex-1 lg:max-w-4xl">

                <div class="flex flex-col gap-1">
                    <label for="alunos_pesquisa" class="text-sm md:text-base font-medium text-cnec-branco/80">
                        Nome do Aluno
                    </label>
                    <input
                        id="alunos_pesquisa"
                        name="aluno"
                        type="text"
                        placeholder="Digite o nome..."
                        class="px-3 py-1.5 rounded bg-cnec-branco text-cnec-azul-escuro placeholder-cnec-azul-escuro/50 outline-none ring-2 ring-transparent focus:ring-cnec-amarelo transition-all w-full"
                    >
                </div>

                <div class="flex flex-col gap-1">
                    <label for="turma_pesquisa" class="text-sm md:text-base font-medium text-cnec-branco/80">
                        Turma
                    </label>
                    <select
                        id="turma_pesquisa"
                        name="turma"
                        class="px-3 py-2 rounded bg-cnec-branco text-cnec-azul-escuro outline-none ring-2 ring-transparent focus:ring-cnec-amarelo transition-all cursor-pointer w-full">
                        <option value="" selected="selected">Todas</option>
                        {% for i in range(1,10) %}
                            <option value="{{ i }}">{{ i }}º Ano</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="flex flex-col gap-1">
                    <label for="livros_pesquisa" class="text-sm md:text-base font-medium text-cnec-branco/80">
                        Título do Livro
                    </label>
                    <input
                        id="livros_pesquisa"
                        name="livro"
                        type="text"
                        placeholder="Digite o título..."
                        class="px-3 py-1.5 rounded bg-cnec-branco text-cnec-azul-escuro placeholder-cnec-azul-escuro/50 outline-none ring-2 ring-transparent focus:ring-cnec-amarelo transition-all w-full"
                    >
                </div>

                <div class="flex flex-col gap-1">
                    <label for="filtro_pendencia" class="text-sm md:text-base font-medium text-cnec-branco/80">
                        Situação
                    </label>
                    <select
                        id="filtro_pendencia"
                        class="px-3 py-2 rounded bg-cnec-branco text-cnec-azul-escuro outline-none ring-2 ring-transparent focus:ring-cnec-amarelo transition-all cursor-pointer w-full"
                    >
                        <option value="">Todos</option>
                        <option value="pendente">Pendente</option>
                        <option value="devolvido">Devolvido</option>
                    </select>
                </div>

            </div>
        </div>

        <div class="p-2 sm:p-4 w-full">
            <div class="p-2 sm:p-4 h-80 sm:h-96 w-full bg-cnec-azul-escuro overflow-auto">
                <div id="tabela_historico" class="min-w-[600px] md:min-w-0 text-xs sm:text-sm md:text-base lg:text-lg w-full"></div>
            </div>
        </div>

    </div>

</div>
    <script src="../../static/js/historico.js" type="module"></script>

{% endblock %}
